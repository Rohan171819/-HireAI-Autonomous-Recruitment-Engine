[tool.poetry]
name = "hireai-ai"
version = "0.1.0"
description = "AI Backend for HireAI"
authors = ["HireAI Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
langgraph = "^0.0.30"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
ollama = "^0.2.0"
pymupdf = "^1.24.0"
playwright = "^1.42.0"
jinja2 = "^3.1.3"
weasyprint = "^62.0"
supabase = "^2.3.0"
python-multipart = "^0.0.9"
slowapi = "^0.1.9"
redis = "^5.0.0"
sentry-sdk = "^1.40.0"
loguru = "^0.7.2"
pyjwt = "^2.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
